# Trusted acceptance only: two distinct native credentials, one scoped provider.
# Keep permission-denial and undeclared-tool probes observable at the Hub.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
network_policies:
  hub:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /mcp/local
        protocol: mcp
        enforcement: enforce
        credential_binding: {provider: vv-hub-qualification}
        mcp:
          versions: ["2026-07-28"]
          allow_all_known_mcp_methods: false
        rules:
          - allow: {method: server/discover}
          - allow: {method: ping}
          - allow: {method: tools/list}
          # Risky calls are explicit: the Hub must produce permission refusals.
          - allow: {method: tools/call, tool: artifact__abort_upload}
          - allow: {method: tools/call, tool: artifact__cancel_access_request}
          - allow: {method: tools/call, tool: artifact__complete_upload}
          - allow: {method: tools/call, tool: artifact__create_download}
          - allow: {method: tools/call, tool: artifact__create_upload}
          - allow: {method: tools/call, tool: artifact__request_artifact_access}
          - allow: {method: tools/call, tool: artifact__set_release_state}
          - allow: {method: tools/call, tool: artifact__sign_upload_parts}
          - allow: {method: tools/call, tool: artifact__create_share_link}
          - allow: {method: tools/call, tool: artifact__decide_access_request}
          - allow: {method: tools/call, tool: artifact__delete_artifact}
          - allow: {method: tools/call, tool: artifact__grant_artifact}
          - allow: {method: tools/call, tool: artifact__revoke_artifact_grant}
          - allow: {method: tools/call, tool: artifact__revoke_share_link}
          - allow: {method: tools/call, tool: artifact__set_upload_limits}
          - allow: {method: resources/read}
          - allow: {method: subscriptions/listen}
          - allow: {method: tasks/get}
          - allow: {method: tasks/cancel}
    binaries:
      - path: /sandbox/bin/artifact-acceptance
  object_storage:
    # Signed PUT/GET requests retain exact authority and headers, without a proxy.
    endpoints:
      - host: host.openshell.internal
        port: 9000
        protocol: tcp
    binaries:
      - path: /sandbox/bin/artifact-acceptance
