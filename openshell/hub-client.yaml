# Member SDK preflight. Application authorization remains the Hub's responsibility.
# A full trusted acceptance runner must separately admit its test executable/providers.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
network_policies:
  hub:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /mcp/local
        protocol: mcp
        enforcement: enforce
        credential_binding: {provider: vv-hub-member}
        mcp:
          versions: ["2026-07-28"]
          allow_all_known_mcp_methods: false
        rules:
          - allow: {method: server/discover}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow: {method: tools/call, tool: time__resolve_time}
          - allow: {method: tools/call, tool: time__convert_time}
          - allow: {method: tools/call, tool: time__expand_schedule}
          - allow: {method: tools/call, tool: time__validate_timeline}
          - allow: {method: tools/call, tool: time__create_event}
          - allow: {method: tools/call, tool: time__cancel_event}
          - allow: {method: resources/read}
          - allow: {method: subscriptions/listen}
          - allow: {method: tasks/get}
          - allow: {method: tasks/cancel}
    binaries:
      - path: /usr/local/bin/veoveo-hub-sdk-cli
