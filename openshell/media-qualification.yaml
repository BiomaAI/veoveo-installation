# Trusted member/billed acceptance only. The member run must reach Hub's refusal.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
network_policies:
  hub:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /mcp/local
        protocol: mcp
        enforcement: enforce
        credential_binding: {provider: vv-media-qualification}
        mcp:
          versions: ["2026-07-28"]
          allow_all_known_mcp_methods: false
        rules:
          - allow: {method: server/discover}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow: {method: tools/call, tool: media__models}
          - allow: {method: tools/call, tool: media__model_schema}
          - allow: {method: tools/call, tool: media__run}
          - allow: {method: tools/call, tool: artifact__create_download}
          - allow: {method: resources/read}
          - allow: {method: subscriptions/listen}
          - allow: {method: tasks/get}
          - allow: {method: tasks/cancel}
      # Own-usage view verifies fake-generation estimate/actual records as well.
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /admin/local/usage/daily
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-media-qualification}
        rules:
          - allow: {method: GET, path: /admin/local/usage/daily}
    binaries:
      - path: /sandbox/bin/media-acceptance
  object_storage:
    endpoints:
      - host: host.openshell.internal
        port: 9000
        protocol: tcp
    binaries:
      - path: /sandbox/bin/media-acceptance
  fixture_controls:
    endpoints:
      - host: vv-services--media-provider--http.openshell.localhost
        port: 17670
        path: /testing/**
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /testing/state}
          - allow: {method: POST, path: /testing/quotes}
          - allow: {method: POST, path: /testing/delivery}
          - allow: {method: POST, path: /testing/predictions/*/complete}
    binaries:
      - path: /sandbox/bin/media-acceptance
