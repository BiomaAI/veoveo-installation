# Existing remotely managed tunnel; native token-file only, no argv/env secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-tunnel
  namespace: veoveo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-tunnel
    spec:
      automountServiceAccountToken: false
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.10.1@sha256:3c0502d2da137286136b44f5b1d0d0be7030cc4833db9f53cff86beadad6cefa
        args:
        - tunnel
        - --no-autoupdate
        - --metrics
        - 0.0.0.0:2000
        - run
        - --token-file
        - /etc/cloudflared-credentials/token
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: credentials
          mountPath: /etc/cloudflared-credentials
          readOnly: true
        - name: ca
          mountPath: /etc/cloudflared-ca
          readOnly: true
        ports:
        - name: metrics
          containerPort: 2000
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          periodSeconds: 5
      volumes:
      - name: credentials
        secret:
          secretName: public-tunnel
          defaultMode: 292
          items:
          - key: token
            path: token
      - name: ca
        configMap:
          name: public-tunnel-ca
