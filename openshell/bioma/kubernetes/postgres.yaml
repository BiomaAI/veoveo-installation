# CloudNativePG 1.30.1; verified Linux Postgres18.6 extension image, UID/GID999:999.
# Keep the exact version tag plus digest: CNPG derives the PostgreSQL major version.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: veoveo-postgres
  namespace: veoveo-system
spec:
  instances: 1
  imageName: registry.cloudflare.com/cd9522254303bfb3d2322a0d9b82764f/veoveo-postgres:18.6-vector0.8.7-postgis3.6.4-k3s@sha256:feacb84577fdca909cd0e3306784f9af84d083222dab00421244a1376520c28a
  imagePullSecrets:
    - name: registry-pull
  postgresUID: 999
  postgresGID: 999
  storage:
    storageClass: local-path
    size: 50Gi
  bootstrap:
    initdb:
      database: veoveo
      owner: veoveo_owner
      secret:
        name: veoveo-owner-db
  managed:
    roles:
      - name: veoveo_owner
        ensure: present
        login: true
        createrole: true
        passwordSecret:
          name: veoveo-owner-db
      - name: openshell_gateway
        ensure: present
        login: true
        passwordSecret:
          name: openshell-gateway-role
      - name: server_lore
        ensure: present
        login: true
        passwordSecret:
          name: lore-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openshell-gateway
  namespace: veoveo-system
spec:
  name: openshell_gateway
  owner: openshell_gateway
  cluster:
    name: veoveo-postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: veoveo-applications
  namespace: veoveo-system
spec:
  name: veoveo
  owner: veoveo_owner
  cluster:
    name: veoveo-postgres
  extensions:
    - name: vector
      ensure: present
    - name: postgis
      ensure: present
  schemas:
    - name: lore
      owner: server_lore
      ensure: present
