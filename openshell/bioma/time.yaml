version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /bin
  - /usr
  - /lib
  - /lib64
  - /etc
  - /proc
  - /dev/urandom
  - /var/log
  read_write:
  - /tmp
  - /dev/null
  - /var/lib/veoveo/time
network_policies:
  registration:
    endpoints:
    - host: veoveo.bioma.ai
      port: 443
      path: /oauth/register
      protocol: rest
      enforcement: enforce
      credential_binding:
        provider: vv-time-registration
      rules:
      - allow:
          method: POST
          path: /oauth/register
    binaries:
    - path: /usr/local/bin/veoveo-mcp-time
  hub_metadata:
    endpoints:
    - host: veoveo.bioma.ai
      port: 443
      path: /.well-known/oauth-authorization-server
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /.well-known/oauth-authorization-server
    - host: veoveo.bioma.ai
      port: 443
      path: /jwks.json
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /jwks.json
    - host: veoveo.bioma.ai
      port: 443
      path: /oauth/register/*
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /oauth/register/*
      - allow:
          method: DELETE
          path: /oauth/register/*
    - host: veoveo.bioma.ai
      port: 443
      path: /oauth/token
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /oauth/token
    binaries:
    - path: /usr/local/bin/veoveo-mcp-time
  database:
    endpoints:
    - host: host.openshell.internal
      port: 5432
      protocol: tcp
    binaries:
    - path: /usr/local/bin/veoveo-mcp-time
