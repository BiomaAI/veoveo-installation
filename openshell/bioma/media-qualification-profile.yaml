id: vv-media-qualification
display_name: Trusted Media member and billed qualification
credentials:
- name: member_access_token
  env_vars:
  - HUB_MEMBER_REFERENCE
  required: true
  auth_style: bearer
  header_name: authorization
  refresh:
    strategy: oauth2_refresh_token
    token_url: https://veoveo.bioma.ai/oauth/token
    scopes:
    - mcp
    refresh_before: 180s
    max_lifetime: 300s
    material:
    - name: client_id
      required: true
    - name: refresh_token
      required: true
      secret: true
- name: billed_access_token
  env_vars:
  - HUB_ADMIN_REFERENCE
  required: true
  auth_style: bearer
  header_name: authorization
  refresh:
    strategy: oauth2_refresh_token
    token_url: https://veoveo.bioma.ai/oauth/token
    scopes:
    - mcp
    refresh_before: 180s
    max_lifetime: 300s
    material:
    - name: client_id
      required: true
    - name: refresh_token
      required: true
      secret: true
