version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /lib64, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/tmp, /dev/null, /var/lib/veoveo/artifact]
network_policies:
  registration:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /oauth/register
        protocol: rest
        enforcement: enforce
        credential_binding: {provider: vv-artifact-registration}
        rules:
          - allow: {method: POST, path: /oauth/register}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-artifact
  hub_metadata:
    endpoints:
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /.well-known/oauth-authorization-server
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /.well-known/oauth-authorization-server}
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /jwks.json
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /jwks.json}
      - host: vv-control--hub--http.openshell.localhost
        port: 17670
        path: /oauth/register/*
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /oauth/register/*}
          - allow: {method: DELETE, path: /oauth/register/*}
    binaries:
      - path: /usr/local/bin/veoveo-mcp-artifact
  database:
    endpoints:
      - host: host.openshell.internal
        port: 5432
        protocol: tcp
    binaries:
      - path: /usr/local/bin/veoveo-mcp-artifact
  object_storage:
    # SigV4 binds the original host and headers. Bytes bypass HTTP interception.
    endpoints:
      - host: host.openshell.internal
        port: 9000
        protocol: tcp
    binaries:
      - path: /usr/local/bin/veoveo-mcp-artifact
