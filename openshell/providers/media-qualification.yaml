id: vv-media-qualification
display_name: Trusted Media member and billed qualification
credentials:
  - name: member_access_token
    env_vars: [HUB_MEMBER_REFERENCE]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://auth.localhost:8443/realms/veoveo/protocol/openid-connect/token
      scopes: [mcp]
      refresh_before: 180s
      max_lifetime: 300s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
  # The existing acceptance admin role selects the billed caller, not Hub admin.
  - name: billed_access_token
    env_vars: [HUB_ADMIN_REFERENCE]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://auth.localhost:8443/realms/veoveo/protocol/openid-connect/token
      scopes: [mcp]
      refresh_before: 180s
      max_lifetime: 300s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
