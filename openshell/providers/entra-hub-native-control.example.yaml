# Dedicated trusted Hub service identity; never attach to a user Computer.
id: vv-hub-native-control
display_name: Entra Hub native control
credentials:
  - name: access_token
    env_vars: [HUB_NATIVE_CONTROL_REFERENCE]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://login.microsoftonline.com/e0ee3c6a-4f58-4f66-8de4-253226eeed5f/oauth2/v2.0/token
      # Use the OpenShell resource App ID URI; .default requests its assigned app roles.
      # Assign openshell-admin plus exactly config:read, workspace:read, workspace:write,
      # sandbox:read, sandbox:write, provider:read and provider:write. Not openshell:all.
      scopes: ["api://8a6d434f-8c4c-4e2c-9756-9b2d94118d17/.default"]
      refresh_before: 180s
      max_lifetime: 3600s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
