id: veoveo-lore-repo
display_name: Direct Lore repository grant
credentials:
  - name: access_token
    env_vars: [LORE_AUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://veoveo.example.com/realms/veoveo/protocol/openid-connect/token
      scopes: [lore-repo-REPOSITORY_ID]
      refresh_before: 180s
      max_lifetime: 300s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
