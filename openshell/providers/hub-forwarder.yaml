id: vv-hub-forwarder
display_name: Local Hub forwarder
credentials:
  - name: access_token
    env_vars: [HUB_MANAGEMENT_REFERENCE]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://auth.localhost:8443/realms/veoveo/protocol/openid-connect/token
      scopes: [sandbox:write]
      refresh_before: 180s
      max_lifetime: 300s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
