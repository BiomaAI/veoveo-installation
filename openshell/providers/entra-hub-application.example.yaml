id: vv-hub-member
display_name: Entra-backed Hub application session
credentials:
  - name: access_token
    env_vars: [HUB_MEMBER_REFERENCE]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      # This is a Hub refresh grant obtained after Entra login, not an Entra
      # client-credentials token presented directly to the MCP profile.
      strategy: oauth2_refresh_token
      token_url: https://veoveo.example.com/oauth/token
      scopes: [mcp]
      refresh_before: 180s
      max_lifetime: 3600s
      material:
        - name: client_id
          required: true
        - name: refresh_token
          required: true
          secret: true
