id: vv-hub-forwarder
display_name: Entra Hub forwarder
credentials:
  - name: access_token
    env_vars: [HUB_MANAGEMENT_REFERENCE]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_client_credentials
      token_url: https://login.microsoftonline.com/11111111-1111-4111-8111-111111111111/oauth2/v2.0/token
      # Use the actual OpenShell resource App ID URI. This requests assigned app roles.
      scopes: ["api://22222222-2222-4222-8222-222222222222/.default"]
      refresh_before: 180s
      max_lifetime: 3600s
      material:
        - name: client_id
          required: true
        - name: client_secret
          required: true
          secret: true
