# Bootstrap OIDC egress only. Workload access is mediated by OpenShell.
node:
  id: vv-egress
  cluster: vv-local
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
static_resources:
  listeners:
  - name: egress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 3128
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          route_config:
            virtual_hosts:
            - name: allowed
              domains:
              - '@OIDC_EGRESS_HOSTS@'
              routes:
              - match:
                  connect_matcher: {}
                route:
                  cluster: egress
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
                  timeout: 0s
            - name: refused
              domains:
              - '*'
              routes:
              - match:
                  connect_matcher: {}
                direct_response:
                  status: 403
              - match:
                  prefix: /
                direct_response:
                  status: 403
          http_filters:
          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  environments:
                    permissions:
                    - any: true
                    principals:
                    - direct_remote_ip:
                        address_prefix: 10.231.10.0
                        prefix_len: 24
                    - direct_remote_ip:
                        address_prefix: 10.231.11.0
                        prefix_len: 24
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config:
                name: egress
                dns_lookup_family: V4_ONLY
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: egress
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config:
          name: egress
          dns_lookup_family: V4_ONLY
