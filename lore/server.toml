# Lore with the existing factory pre-push hook. Ordinary authorization is upstream.
# The Desktop adapter signs tokens using the native resources claim.

[hooks.factory_branch]
enabled = true
# Trusted installation/integration fills assignments before authoring starts.
# Identities without an assignment keep normal Lore behavior.
assignments = {}

[server.auth]
jwt_issuer = ["https://localhost:7443/oauth"]
jwt_audience = ["lores://vv-lore.internal:41337"]
jwt_typ = "at+jwt"
# `lore repository list` names no repository; a client reaches the ones it is granted.
baseline_access = "denied"
repository_catalog = "auth_service"
repository_catalog_url = "http://vv-srv-lore.internal:8081"

[server.auth.jwk]
endpoint = "http://vv-srv-lore.internal:8080/oauth/jwks.json"

# Use Lore's native auth-service contract for Desktop and repository-scoped
# access tokens. No dependency on the removed Veoveo gateway's OAuth discovery.
[environment.endpoint]
auth_url = "http://vv-srv-lore.internal:8081"

[server.quic]
enabled = false

[server.grpc.certificate]
cert_file = "/etc/lore/tls/vv-lore.internal.crt"
pkey_file = "/etc/lore/tls/vv-lore.internal.key"

[immutable_store.local]
path = "/data"

[mutable_store.local]
path = "/data"
