# Upstream infrastructure of the local installation, which runs outside OpenShell.
# Component environments run as OpenShell sandboxes, described in README.md.
name: vv-local

services:
  vv-postgres:
    container_name: vv-postgres
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_PASSWORD: ${VEOVEO_POSTGRES_PASSWORD:?set VEOVEO_POSTGRES_PASSWORD to the superuser password before starting}
      # Read once by postgres/initdb/owner.sql to create the installation owner.
      VEOVEO_DATABASE_PASSWORD: ${VEOVEO_DATABASE_PASSWORD:?set VEOVEO_DATABASE_PASSWORD to the installation owner password before starting}
    # Keepalive probes close the connection of a host that disappears within about 25
    # seconds, which releases the advisory locks of its process instances.
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=10
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=3
    ports:
      # Loopback only: sandboxes reach it through host.openshell.internal, and the
      # network does not.
      - "127.0.0.1:${VEOVEO_DATABASE_PORT:-5432}:5432"
    volumes:
      - vv-postgres:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, so the socket-only server that runs the init scripts never counts as ready.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "veoveo_owner", "--dbname", "veoveo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  vv-postgres:
