# The local installation's upstream infrastructure, PostgreSQL and the SeaweedFS object
# store, runs here outside OpenShell.
# Component environments run as OpenShell sandboxes, described in README.md.
name: vv-local

services:
  vv-postgres:
    container_name: vv-postgres
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_PASSWORD: ${VEOVEO_POSTGRES_PASSWORD:?set VEOVEO_POSTGRES_PASSWORD to the superuser password before starting}
      # Read once by postgres/initdb/owner.sql to create the installation owner.
      VEOVEO_DATABASE_PASSWORD: ${VEOVEO_DATABASE_PASSWORD:?set VEOVEO_DATABASE_PASSWORD to the installation owner password before starting}
    # Keepalive probes close the connection of a host that disappears within about 25
    # seconds, which releases the advisory locks of its process instances.
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=10
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=3
    ports:
      # Loopback only: sandboxes reach it through host.openshell.internal, and the
      # network does not.
      - "127.0.0.1:${VEOVEO_DATABASE_PORT:-5432}:5432"
    volumes:
      - vv-postgres:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, so the socket-only server that runs the init scripts never counts as ready.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "veoveo_owner", "--dbname", "veoveo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  vv-seaweedfs:
    container_name: vv-seaweedfs
    # SeaweedFS 4.48, the latest stable release, unmodified, in its all-in-one `weed mini`
    # mode: master, volume server, filer and S3 gateway in one process. The Artifact
    # server signs every byte transfer with this credential and calls only standard S3
    # operations. With no S3 configuration file, SeaweedFS takes its one identity from
    # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${VEOVEO_STORAGE_ACCESS_KEY:?set VEOVEO_STORAGE_ACCESS_KEY to the object store's access key before starting}
      AWS_SECRET_ACCESS_KEY: ${VEOVEO_STORAGE_SECRET_KEY:?set VEOVEO_STORAGE_SECRET_KEY to the object store's secret key before starting}
    ports:
      # The S3 endpoint on loopback only; the other ports stay inside the container.
      # Sandboxes reach it through host.openshell.internal. The Artifact server retries
      # its bucket preparation, so it decides when storage is ready.
      - "127.0.0.1:${VEOVEO_STORAGE_PORT:-9000}:9000"
    volumes:
      - vv-seaweedfs:/data
    restart: unless-stopped

  vv-tunnel:
    container_name: vv-tunnel
    # Optional: `docker compose --profile tunnel up -d` connects the installation's
    # public origin to this workstation through a remote-managed Cloudflare Tunnel,
    # whose ingress rules live with the tunnel. cloudflared 2026.10.0, the latest stable
    # release, unmodified.
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: [tunnel, --no-autoupdate, run]
    environment:
      # Compose reads every service's variables even when its profile is off, so the
      # token is optional here and cloudflared refuses to start without it.
      TUNNEL_TOKEN: ${VEOVEO_TUNNEL_TOKEN:-}
    # Host networking, so the tunnel reaches the environments' forwards on 127.0.0.1.
    network_mode: host
    restart: unless-stopped

volumes:
  vv-postgres:
  vv-seaweedfs:
