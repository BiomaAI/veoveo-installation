  - name: inference
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8443
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: inference
          codec_type: AUTO
          stream_idle_timeout: 300s
          route_config:
            virtual_hosts:
            - name: inference
              domains:
              - inference.internal:8443
              - inference.internal
              routes:
              - match:
                  path: /v1/chat/completions
                  headers:
                  - name: :method
                    string_match:
                      exact: POST
                route:
                  cluster: deepinfra
                  host_rewrite_literal: api.deepinfra.com
                  timeout: 300s
                  prefix_rewrite: /v1/openai/chat/completions
              - match:
                  prefix: /
                direct_response:
                  status: 403
          http_filters:
          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  sandbox:
                    permissions:
                    - any: true
                    principals:
                    - direct_remote_ip:
                        address_prefix: 10.231.20.3
                        prefix_len: 32
                    - direct_remote_ip:
                        address_prefix: 10.231.21.3
                        prefix_len: 32
                    - direct_remote_ip:
                        address_prefix: 10.231.22.3
                        prefix_len: 32
                    - direct_remote_ip:
                        address_prefix: 10.231.23.3
                        prefix_len: 32
          - name: envoy.filters.http.credential_injector
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
              overwrite: true
              credential:
