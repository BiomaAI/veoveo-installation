# Credentials never enter development containers. Each Lore listener binds its own network.
node:
  id: vv-autonomy-edge
  cluster: vv-local
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
static_resources:
  listeners:
  - name: lore-vv-srv-gateway
    address:
      socket_address:
        address: 10.231.20.2
        port_value: 7443
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: lore-vv-srv-gateway
          codec_type: HTTP2
          stream_idle_timeout: 300s
          route_config:
            virtual_hosts:
            - name: lore-vv-srv-gateway
              domains:
              - lore-proxy.internal:7443
              - lore-proxy.internal
              routes:
              - match:
                  prefix: /
                route:
                  cluster: lore
                  timeout: 0s
          http_filters:
          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  sandbox:
                    permissions:
                    - any: true
                    principals:
                    - direct_remote_ip:
                        address_prefix: 10.231.20.3
                        prefix_len: 32
          - name: envoy.filters.http.credential_injector
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
              overwrite: true
              credential:
                name: envoy.http.injected_credentials.generic
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                  credential:
                    name: lore-vv-srv-gateway
                    sds_config:
                      path_config_source:
                        path: /etc/envoy/lore/lore-vv-srv-gateway.json
                  header: Authorization
          - &id001
            name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain:
                filename: /etc/envoy/tls/server.crt
              private_key:
                filename: /etc/envoy/tls/server.key
            alpn_protocols:
            - h2
            - http/1.1
