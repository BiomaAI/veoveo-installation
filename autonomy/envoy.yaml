        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain:
                filename: /etc/envoy/tls/server.crt
              private_key:
                filename: /etc/envoy/tls/server.key
            alpn_protocols:
            - h2
            - http/1.1
  - name: dependencies
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 3128
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: dependencies
          codec_type: AUTO
          stream_idle_timeout: 300s
          route_config:
            virtual_hosts:
            - name: dependencies
              domains:
              - static.rust-lang.org:443
              - index.crates.io:443
              - static.crates.io:443
              - crates.io:443
              - github.com:443
              - api.github.com:443
              routes:
              - match:
                  connect_matcher: {}
                route:
                  cluster: dependencies
                  upgrade_configs:
                  - upgrade_type: CONNECT
                    connect_config: {}
                  timeout: 0s
            - name: refused
              domains:
              - '*'
              routes:
              - match:
                  connect_matcher: {}
                direct_response:
                  status: 403
              - match:
                  prefix: /
                direct_response:
                  status: 403
          http_filters:
          - name: envoy.filters.http.rbac
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: ALLOW
                policies:
                  sandbox:
                    permissions:
                    - any: true
                    principals:
                    - direct_remote_ip:
                        address_prefix: 10.231.20.3
                        prefix_len: 32
                    - direct_remote_ip:
                        address_prefix: 10.231.21.3
                        prefix_len: 32
                    - direct_remote_ip:
                        address_prefix: 10.231.22.3
                        prefix_len: 32
                    - direct_remote_ip:
                        address_prefix: 10.231.23.3
                        prefix_len: 32
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config:
                name: dependencies
                dns_lookup_family: V4_ONLY
          - *id001
  clusters:
  - name: lore
    type: STRICT_DNS
    connect_timeout: 10s
    load_assignment:
      cluster_name: lore
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: vv-lore.internal
                port_value: 41337
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/envoy/ca/ca.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: vv-lore.internal
          alpn_protocols:
          - h2
          - http/1.1
        sni: vv-lore.internal
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
  - name: deepinfra
    type: STRICT_DNS
    connect_timeout: 10s
    load_assignment:
      cluster_name: deepinfra
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api.deepinfra.com
                port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/ssl/certs/ca-certificates.crt
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher:
                exact: api.deepinfra.com
        sni: api.deepinfra.com
  - name: dependencies
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config:
          name: dependencies
          dns_lookup_family: V4_ONLY
  secrets:
  - name: inference
    generic_secret:
      secret:
        filename: /etc/envoy/secrets/inference
overload_manager:
  resource_monitors:
  - name: envoy.resource_monitors.global_downstream_max_connections
    typed_config:
      '@type': type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
      max_active_downstream_connections: 1024
