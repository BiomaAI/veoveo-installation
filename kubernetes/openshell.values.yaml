# Maintained chart schema from 846de5fa01234a22827915b3f4e5b9092367078b.
# Bioma's deployed images, published to the installation's local registry as
# veoveo/openshell/{gateway,supervisor,sandbox}: the gateway is built from OpenShell
# c28524bdda5145f45db3285a0b5876e8d5dfff15, the supervisor and sandbox runtime from
# d1d4da39941ecf809d9b0dee51032277cbc42ea4. component-lock.json records them. The
# node pulls them through its registries.yaml entry; no image-pull Secret is used.
# The issuer, audience and role claims are Bioma's public Entra identifiers.
fullnameOverride: openshell
replicaCount: 1
workload:
  kind: deployment
global:
  image:
    registry: registry.veoveo-system.svc.cluster.local:5000/veoveo
gateway:
  image:
    digest: sha256:ffd273af21a54e40dca67fa773d6c310a28a33d6f25a6ae195fe55c50c7c36a5
supervisor:
  image:
    digest: sha256:6ce6d7b23ff4512ae371a463896260d6fae91304ae7854c81f40be116d2a4cc9
sandboxRuntime:
  image:
    digest: sha256:d2a791ffdbe143e50dcf6289ece400819733c355b6a51614e9dfd925959563ff
server:
  externalDbSecret: openshell-gateway-db
  extraVolumes:
    - name: database-ca
      configMap:
        name: postgres-client-ca
    - name: destination-ca
      configMap:
        name: platform-destination-roots-v1
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: database-ca
      mountPath: /etc/openshell/database-ca
      readOnly: true
    - name: destination-ca
      mountPath: /etc/openshell/platform-ca
      readOnly: true
  disableTls: false
  workspaceStorageClass: local-path
  workspaceDefaultStorageSize: 10Gi
  # Match Factory/Computer seed ownership and trusted application runtimes.
  sandboxUid: 10001
  sandboxGid: 10001
  sandboxJwt:
    # Selects the default managed namespace ID; render matching PVC/Job namespaces.
    gatewayId: openshell
  tls:
    enableMtls: true
    certSecretName: openshell-server-tls
    clientCaSecretName: openshell-server-client-ca
    clientTlsSecretName: openshell-client-tls
pkiInitJob:
  enabled: true
  serverDnsNames:
    - openshell.openshell.svc.cluster.local
certManager:
  enabled: false
gatewayConfig:
  openshell:
    version: 2
  openshell.gateway:
    name: openshell
    compute_driver: kubernetes
  openshell.gateway.tcp_forwarding:
    active_per_sandbox: 128
    active_per_replica: 1024
    pending_per_sandbox: 128
    pending_per_replica: 512
  openshell.gateway.auth:
    allow_unauthenticated_users: false
  openshell.gateway.oidc:
    issuer: https://login.microsoftonline.com/e0ee3c6a-4f58-4f66-8de4-253226eeed5f/v2.0
    audience: 8a6d434f-8c4c-4e2c-9756-9b2d94118d17
    roles_claim: roles
    scopes_claim: roles
    admin_role: openshell-admin
    user_role: openshell-user
  openshell.drivers.kubernetes:
    additional_ca_bundle: /etc/openshell/platform-ca/ca.crt
    allow_driver_config: true
    workspace_mode: managed
