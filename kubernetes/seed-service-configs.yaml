# Trusted file copy; a rerun replaces the files in the existing claim.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-artifact-config-v1
  namespace: openshell-openshell-vv-services
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: copy
        image: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
        command:
        - /bin/sh
        - -ec
        args:
        # Replace the file in the existing claim by renaming a complete copy over it,
        # so the claim and its UID stay.
        - |
          umask 077
          trap 'rm -f /output/.storage.env.new' EXIT
          cp /input/storage.env /output/.storage.env.new
          chmod 0600 /output/.storage.env.new
          mv -f /output/.storage.env.new /output/storage.env
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: input
          mountPath: /input
          readOnly: true
        - name: output
          mountPath: /output
      volumes:
      - name: input
        secret:
          secretName: artifact-config-bootstrap
          defaultMode: 288
          items:
          - key: storage.env
            path: storage.env
      - name: output
        persistentVolumeClaim:
          claimName: artifact-config-v1
